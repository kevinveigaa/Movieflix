services:
  - type: web
    name: movieflix-api
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm --prefix backend install
    startCommand: node backend/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: TMDB_API_KEY
        sync: false
      - key: VITE_STREAMBETTER_KEY
        sync: false
      # Chave PÚBLICA do StreamBetter (sb_pk_*) — usada no embed oficial que
      # roda no navegador (fallback do player). Não é segredo.
      - key: VITE_STREAMBETTER_PUBLIC_KEY
        value: sb_pk_331739a18c650ce0f4c56ebcc34c39630485ffa7366a1ed5
      # Chave SECRETA do plano API do StreamBetter (sb_sk_*) — usada SOMENTE
      # no backend para a rota oficial de link direto /api/v1/stream (m3u8 sem
      # Cloudflare). Nunca vai para o bundle do frontend.
      - key: STREAMBETTER_API_KEY
        sync: false
