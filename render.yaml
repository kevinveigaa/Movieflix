services:
  - type: web
    name: movieflix-api
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm --prefix backend install
    startCommand: node backend/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: TMDB_API_KEY
        sync: false
      - key: VITE_STREAMBETTER_KEY
        sync: false
      # Chave PÚBLICA do embed (sb_pk_*) — válida só no domínio autorizado.
      - key: VITE_STREAMBETTER_PUBLIC_KEY
        value: sb_pk_331739a18c650ce0f4c56ebcc34c39630485ffa7366a1ed5
