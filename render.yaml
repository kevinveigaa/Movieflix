services:
  - type: web
    name: movieflix-api
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm --prefix backend install
    startCommand: node backend/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: TMDB_API_KEY
        sync: false
      - key: VITE_STREAMBETTER_KEY
        sync: false
      # Chave PÚBLICA do StreamBetter (sb_pk_*) — plano Creator. Usada no
      # EMBED OFICIAL que roda no navegador (VITE_STREAMBETTER_PUBLIC_KEY).
      # Não é segredo. O domínio do site (movieflix-bszf.onrender.com) precisa
      # estar cadastrado na conta Creator do StreamBetter.
      - key: VITE_STREAMBETTER_PUBLIC_KEY
        value: sb_pk_19fe7c75a49585cd84ced96806703a2176768fa4f77a7ea4
      # ASSINATURA: ativação MANUAL via WhatsApp (e-mail + plano). Nenhuma
      # variável de Mercado Pago é necessária no fluxo atual. O admin ativa a
      # conta pela função SQL activate_subscription_by_email no Supabase.
