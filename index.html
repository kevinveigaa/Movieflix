    <script>
      // ── ÁREA PRIVADA ─────────────────────────────────────────────────────
      // O site usa HashRouter, então o caminho canônico da rota privada é
      // `/#/p/<slug>`. Este redirecionamento permite abrir também o formato
      // "limpo" `/p/<slug>` (sem `#`) e levá-lo para a URL canônica.
      // Nenhum slug é escrito aqui — só o prefixo `/p/`, que não revela nada.
      (function () {
        try {
          var caminho = window.location.pathname;
          // Área privada (`/p/<slug>`) e área de projetos (`/projetos`): o site
          // usa HashRouter, então o caminho canônico é `/#/...`. Este
          // redirecionamento permite abrir também o formato "limpo" (sem `#`).
          // Nenhum slug é escrito aqui — só os prefixos, que não revelam nada.
          var privado = caminho.indexOf('/p/') === 0;
          var projetos = caminho === '/projetos' || caminho.indexOf('/projetos/') === 0;
          if (!privado && !projetos) return;
          var alvo = '/' + '#' + caminho + window.location.search;
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', alvo);
            window.location.reload();
          } else {
            window.location.replace(alvo);
          }
        } catch (e) {
          /* ignora — o restante do site continua funcionando normalmente */
        }
      })();
    </script>
    <script>
      // Limpa service worker antigo e força atualização
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            reg.unregister();
          });
        });
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            caches.delete(name);
          });
        });
      }
