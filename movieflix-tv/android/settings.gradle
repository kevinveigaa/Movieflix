/*
 * MovieFlix TV 4.0.0 — projeto Gradle independente.
 *
 * Módulo único (:app) em Kotlin + AndroidX/Leanback. Nada aqui é compartilhado
 * com o app mobile (android/), que permanece intocado.
 */
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MovieFlixTV"
include ':app'
