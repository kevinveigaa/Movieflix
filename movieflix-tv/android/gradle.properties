# Memória contida: o container tem limite de cgroup de 2 GB; o dexing (D8) e o
# compilador Java rodam no mesmo heap, então o teto fica abaixo disso.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Tarefas auxiliares desligadas: não mudam o APK e só consomem tempo/memória.
android.enableProfileEmbedding=false
android.experimental.enableProfileEmbedding=false
android.enableResourceOptimizations=false
android.baselineProfile.enable=false
