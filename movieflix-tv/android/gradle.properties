org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.parallel=false
# Kotlin roda IN-PROCESS (mesma JVM do Gradle): 1 processo só, o que mantém o
# pico de memória dentro do limite do contêiner (2 GB, sem swap).
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# Desliga tarefas auxiliares que só consomem memória e não mudam o APK.
android.enableProfileEmbedding=false
android.experimental.enableProfileEmbedding=false
android.enableResourceOptimizations=false
android.baselineProfile.enable=false
# O dexing usa um processo próprio; deixar o R8/D8 trabalhar em 1 worker reduz o pico.
android.enableDexingArtifactTransform=true
