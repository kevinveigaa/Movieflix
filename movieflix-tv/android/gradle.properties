# Memória contida: o container tem limite de cgroup de 2 GB; o dexing (D8) e o
# compilador Kotlin rodam no mesmo heap, entao o teto fica abaixo disso.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=224m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# Tarefas auxiliares desligadas: não mudam o APK e só consomem tempo/memória.
android.enableProfileEmbedding=false
android.experimental.enableProfileEmbedding=false
android.enableResourceOptimizations=false
android.baselineProfile.enable=false
android.enableDexingArtifactTransform=true
android.enableR8.fullMode=false
# Um unico dexer por vez: o pico de memoria do D8 e o gargalo neste container.
kotlin.daemon.jvmargs=-Xmx768m
