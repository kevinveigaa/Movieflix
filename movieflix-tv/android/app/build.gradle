apply plugin: 'com.android.application'

android {
    namespace "com.movieflix.tv"
    compileSdk 34

    defaultConfig {
        applicationId "com.movieflix.tv"
        minSdk 23
        targetSdk 34
        versionCode 503
        versionName "5.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // O app exibe o site oficial em WebView; o lint de segurança do WebView
        // (JavaScript + ponte nativa) é intencional e já mitigado em MainActivity:
        // só o domínio oficial do MovieFlix fica no WebView e a ponte expõe 4
        // métodos idempotentes.
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

/*
 * Kotlin 1.8+ incorporou kotlin-stdlib-jdk7/jdk8 dentro de kotlin-stdlib.
 * As dependências AndroidX trazem as variantes antigas (1.6.0) junto com a
 * nova (1.8.22), o que gera classes duplicadas no dex. Excluímos as antigas.
 */
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
    // Injeção de JS no início do documento (autoclick do passo "Abrir link"
    // do provedor) e verificação de suporte por FEATURE. É o mesmo mecanismo
    // oficial recomendado para esse tipo de injeção em WebView.
    implementation "androidx.webkit:webkit:1.9.0"
    testImplementation "junit:junit:4.13.2"
}
