apply plugin: 'com.android.application'

// MovieFlix TV 4.0.1 — WebView shell que carrega o MESMO site MovieFlix e
// ativa a interface de TV que já existe no site (src/tv). Sem código de UI
// duplicado: a identidade, o catálogo, o login, os planos e o player são os
// do MovieFlix existente.
//
// Java puro (sem Kotlin, sem AndroidX): o app só usa APIs da plataforma
// (Activity, WebView, Intent), então o dexing é trivial e o build confiável.

android {
    namespace 'com.movieflix.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.movieflix.tv'
        minSdk 21
        targetSdk 34
        versionCode 401
        versionName '4.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
